apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak-qual

resources:
  - ../../base

images:
  - name: localhost:5001/keycloak-26-app
    newName: localhost:5001/keycloak-26-app
    newTag: bootstrap

patches:
  - target:
      group: k8s.keycloak.org
      version: v2beta1
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: keycloak-qual.localhost

