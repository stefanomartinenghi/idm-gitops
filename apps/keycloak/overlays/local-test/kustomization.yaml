apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak-test

resources:
  - ../../base

images:
  - name: localhost:5001/keycloak-26-app
    newName: localhost:5001/keycloak-26-app
    newTag: eb9e235f7cefcd924e063496b0f2418d62142464

patches:
  - target:
      group: k8s.keycloak.org
      version: v2beta1
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: http://keycloak-test.localhost:8080

