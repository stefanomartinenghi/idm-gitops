apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idm-prod

resources:
  - ../../base

images:
  - name: localhost:5001/idm-app
    newName: localhost:5001/idm-app
    newTag: 78069f84e41e047ea3927cba4ec38d99cb665040

replicas:
  - name: idm-app
    count: 3

patches:
  - target:
      kind: Deployment
      name: idm-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: local-prod
  - target:
      kind: Ingress
      name: idm-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: idm-prod.localhost
