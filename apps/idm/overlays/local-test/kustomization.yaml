apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idm-test

resources:
  - ../../base

images:
  - name: localhost:5001/idm-app
    newName: localhost:5001/idm-app
    newTag: 3563b36ab575dae954aef9d12288fd100b8a9034

replicas:
  - name: idm-app
    count: 1

patches:
  - target:
      kind: Deployment
      name: idm-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: local-test
