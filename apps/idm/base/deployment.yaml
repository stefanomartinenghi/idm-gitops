apiVersion: apps/v1
kind: Deployment
metadata:
  name: idm-app
  labels:
    app.kubernetes.io/name: idm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idm-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idm-app
    spec:
      containers:
        - name: idm-app
          image: localhost:5001/idm-app:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: APP_ENV
              value: local
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
